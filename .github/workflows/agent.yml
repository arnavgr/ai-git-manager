name: OpenClaude Live Chat Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'User Prompt'
        required: true
        type: string
      repo:
        description: 'Target Repo'
        required: true
        type: string
      branch:
        description: 'Target Branch'
        required: false
        default: 'main'
        type: string

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: "qwen/qwen3.6-27b"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: "openrouter/free"
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      USER_PROMPT: ${{ github.event.inputs.prompt }}
      TARGET_REPO: ${{ github.event.inputs.repo }}
      TARGET_BRANCH: ${{ github.event.inputs.branch }}
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
      - name: Checkout Target Repo
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          git clone "https://github.com/$TARGET_REPO" target
          cd target
          if ! git checkout "$TARGET_BRANCH" 2>/dev/null; then
            git checkout -b "$TARGET_BRANCH"
          fi

      - name: Setup Node & Install OpenClaude
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install OpenClaude
        run: npm install -g @gitlawb/openclaude

      - name: Run Live Chat Bridge
        working-directory: ./target
        run: |
          node << 'EOF'
          const { spawnSync } = require('child_process');
          const fs = require('fs');
          const path = require('path');

          const CF_ACCOUNT_ID = process.env.CF_ACCOUNT_ID;
          const CF_API_TOKEN = process.env.CF_API_TOKEN;
          const KV_NAMESPACE_ID = process.env.KV_NAMESPACE_ID;
          const KV_URL = `https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NAMESPACE_ID}/values/chat_state`;
          const HEADERS = { 
            "Authorization": `Bearer ${CF_API_TOKEN}`, 
            "Content-Type": "application/json" 
          };

          const MODEL_LABELS = {
            'gemini-3.7': 'Gemini 3.7 Flash',
            'gemini-3.6': 'Gemini 3.6 Flash',
            'gemini-3.5': 'Gemini 3.5 Flash',
            'gemini-3.5-lite': 'Gemini 3.5 Flash-Lite',
            'empero-qwen': 'Empero Qwen 3.8 (27B-FP8)',
            'gemini-3.1-lite': 'Gemini 3.1 Flash-Lite',
            'openrouter': 'OpenRouter Free',
            'groq': 'Groq (Qwen 3.6 27B)'
          };

          async function getState() {
            try {
              const res = await fetch(KV_URL, { headers: HEADERS });
              if (!res.ok) return null;
              return await res.json();
            } catch (e) {
              return null;
            }
          }

          async function setState(data) {
            try {
              await fetch(KV_URL, { 
                method: 'PUT', 
                headers: HEADERS, 
                body: JSON.stringify(data) 
              });
            } catch (e) {
              console.error("Failed to update KV state:", e);
            }
          }

          function runAgent(provider, sessionId, userMsg, effort) {
            let env = { ...process.env };
            const args = [];

            const effortLevel = (effort || 'high').toLowerCase();
            env.CLAUDE_CODE_EFFORT = effortLevel;

            delete env.CLAUDE_CODE_USE_OPENAI;
            delete env.CLAUDE_CODE_OPENAI_MAX_OUTPUT_TOKENS;

            if (provider === 'gemini-3.7') {
              args.push('--provider', 'gemini', '--model', 'gemini-3.7-flash');
            } else if (provider === 'gemini-3.6') {
              args.push('--provider', 'gemini', '--model', 'gemini-3.6-flash');
            } else if (provider === 'gemini-3.5') {
              args.push('--provider', 'gemini', '--model', 'gemini-3.5-flash');
            } else if (provider === 'gemini-3.5-lite') {
              args.push('--provider', 'gemini', '--model', 'gemini-3.5-flash-lite');
            } else if (provider === 'empero-qwen') {
              args.push('--provider', 'openai', '--model', 'Qwen/Qwen3.8-27B-FP8');
              env.CLAUDE_CODE_USE_OPENAI = "1";
              env.OPENAI_API_KEY = "free";
              env.OPENAI_BASE_URL = "https://free.empero.org/v1";
            } else if (provider === 'gemini-3.1-lite') {
              args.push('--provider', 'gemini', '--model', 'gemini-3.1-flash-lite');
            } else if (provider === 'openrouter') {
              args.push('--provider', 'openai', '--model', process.env.OPENROUTER_MODEL);
              env.CLAUDE_CODE_USE_OPENAI = "1";
              env.OPENAI_API_KEY = env.OPENROUTER_API_KEY;
              env.OPENAI_BASE_URL = "https://openrouter.ai/api/v1";
              env.CLAUDE_CODE_OPENAI_MAX_OUTPUT_TOKENS = JSON.stringify({ [process.env.OPENROUTER_MODEL]: 4000 });
            } else if (provider === 'groq') {
              args.push('--provider', 'openai', '--model', process.env.GROQ_MODEL);
              env.CLAUDE_CODE_USE_OPENAI = "1";
              env.OPENAI_API_KEY = env.GROQ_API_KEY;
              env.OPENAI_BASE_URL = "https://api.groq.com/openai/v1";
              env.CLAUDE_CODE_OPENAI_MAX_OUTPUT_TOKENS = JSON.stringify({ [process.env.GROQ_MODEL]: 16384 });
            }

            if (sessionId) {
              args.push('--resume', sessionId);
            }
            
            let finalPrompt = userMsg;
            if (effortLevel !== 'none') {
              finalPrompt = `[Reasoning Effort: ${effortLevel.toUpperCase()}]\n` + finalPrompt;
            }

            args.push('-p', finalPrompt, '--dangerously-skip-permissions');

            const result = spawnSync('openclaude', args, { 
              encoding: 'utf8', 
              timeout: 900000, // 15 min per command
              env: env 
            });
            
            const spawnErrorMsg = result.error ? `\n[spawn error: ${result.error.message}]` : "";
            const combinedOutput = (result.stdout || "") + "\n" + (result.stderr || "") + spawnErrorMsg;
            const match = combinedOutput.match(/--resume\s+([a-zA-Z0-9_-]+)/);
            const newSessionId = match ? match[1] : sessionId;
            
            const isError = combinedOutput.toLowerCase().includes("error: 429") || 
                            combinedOutput.toLowerCase().includes("quota exceeded") ||
                            combinedOutput.toLowerCase().includes("rate limit") ||
                            combinedOutput.toLowerCase().includes("invalid_request_error") ||
                            result.status !== 0;

            return { 
              success: !isError && result.status === 0, 
              output: combinedOutput.trim() || "(No output from agent)", 
              sessionId: newSessionId, 
              provider: provider 
            };
          }

          async function loop() {
            let lastMsgId = 0;
            let lastActivityTime = Date.now();
            const IDLE_TIMEOUT_MS = 15 * 60 * 1000; // 15 mins idle auto-shutdown

            while(true) {
              try {
                const state = await getState();
                
                if (state && Number(state.msg_id) > lastMsgId) {
                  lastMsgId = Number(state.msg_id);
                  lastActivityTime = Date.now();
                  const userMsg = String(state.last_user || "").trim();
                  const effort = String(state.effort || "high");
                  
                  await setState({ ...state, status: "thinking" });

                  if (userMsg === '/exit') {
                    await setState({ 
                      ...state, 
                      status: "exited", 
                      model_info: "Session terminated.",
                      last_agent: "Runner terminated by user." 
                    });
                    process.exit(0);
                  } 
                  else if (userMsg === '/push') {
                    const runGit = (gitArgs) => spawnSync('git', gitArgs, { encoding: 'utf8' });

                    runGit(['config', 'user.name', 'OpenClaude Agent']);
                    runGit(['config', 'user.email', 'agent@arnavgr.com']);
                    runGit(['add', '.']);

                    const commit = runGit(['commit', '-m', 'Live chat agent update']);
                    const commitOutput = ((commit.stdout || "") + (commit.stderr || "")).trim();
                    const nothingToCommit = commit.status !== 0 && /nothing to commit/i.test(commitOutput);

                    if (commit.status !== 0 && !nothingToCommit) {
                      await setState({ ...state, status: "waiting", last_agent: "❌ Commit failed:\n\n" + commitOutput });
                      continue;
                    }

                    const push = runGit(['push', 'origin', 'HEAD']);
                    const pushOutput = ((push.stdout || "") + (push.stderr || "")).trim();

                    if (push.status !== 0) {
                      await setState({ ...state, status: "waiting", last_agent: "❌ Push failed:\n\n" + pushOutput });
                    } else if (nothingToCommit) {
                      await setState({ ...state, status: "waiting", last_agent: "ℹ️ Nothing new to commit — working tree already matched HEAD. Push checked and OK." });
                    } else {
                      await setState({ ...state, status: "waiting", last_agent: "✅ Changes successfully committed and pushed to git." });
                    }
                    continue;
                  }

                  // 1. Process File Attachment
                  let instruction = userMsg;
                  if (state.attachment && state.attachment.name && state.attachment.content) {
                    try {
                      const targetFilePath = path.join(process.cwd(), state.attachment.name);
                      fs.writeFileSync(targetFilePath, state.attachment.content, 'utf8');
                      instruction = `[System Notice: The user uploaded file '${state.attachment.name}', which has been written to the repo root directory.]\n\n` + userMsg;
                    } catch (e) {
                      console.error("Failed to write attachment:", e);
                    }
                  }

                  // 2. Build prioritized fallback list
                  const defaultOrder = [
                    'gemini-3.7', 
                    'gemini-3.6', 
                    'gemini-3.5', 
                    'gemini-3.5-lite', 
                    'empero-qwen', 
                    'gemini-3.1-lite', 
                    'openrouter', 
                    'groq'
                  ];

                  let candidateProviders = [];
                  if (state.provider_choice && state.provider_choice !== 'auto' && defaultOrder.includes(state.provider_choice)) {
                    candidateProviders = [state.provider_choice, ...defaultOrder.filter(p => p !== state.provider_choice)];
                  } else {
                    candidateProviders = defaultOrder;
                  }

                  let activeProvider = state.provider || candidateProviders[0];
                  let failedAttempts = [];
                  let result = runAgent(activeProvider, state.session_id, instruction, effort);

                  // 3. Fallback Execution Loop
                  if (!result.success) {
                    failedAttempts.push(MODEL_LABELS[activeProvider] || activeProvider);
                    for (const p of candidateProviders) {
                      if (p === activeProvider) continue;
                      
                      await setState({
                        ...state,
                        status: "thinking",
                        model_info: `⚠️ ${MODEL_LABELS[activeProvider]} failed. Retrying with ${MODEL_LABELS[p]}...`
                      });

                      result = runAgent(p, state.session_id, instruction, effort);
                      if (result.success) break;
                      failedAttempts.push(MODEL_LABELS[p] || p);
                    }
                  }

                  if (!result.success) {
                    result.output = "❌ All configured providers failed or hit quotas.\n\n" + result.output;
                  }

                  // 4. Construct Telemetry Status String
                  let telemetryString = `Active: ${MODEL_LABELS[result.provider] || result.provider}`;
                  if (failedAttempts.length > 0) {
                    telemetryString += ` | Failed/Skipped: ${failedAttempts.join(', ')}`;
                  }

                  await setState({ 
                    status: "waiting", 
                    last_user: userMsg, 
                    last_agent: result.output,
                    msg_id: lastMsgId,
                    session_id: result.sessionId,
                    provider: result.success ? result.provider : state.provider,
                    provider_choice: state.provider_choice || 'auto',
                    effort: effort,
                    model_info: telemetryString,
                    attachment: null
                  });
                }

                if (Date.now() - lastActivityTime > IDLE_TIMEOUT_MS) {
                  await setState({ 
                    ...(state || {}), 
                    status: "exited", 
                    model_info: "Session expired (Inactivity)",
                    last_agent: "⏱️ Runner terminated automatically due to 15 minutes of inactivity." 
                  });
                  process.exit(0);
                }

              } catch (err) {
                console.error("Bridge runtime error:", err);
              }
              
              await new Promise(r => setTimeout(r, 3000));
            }
          }

          loop();
          EOF

      - name: Final KV Status Update
        if: always()
        run: |
          node << 'EOF'
          const CF_ACCOUNT_ID = process.env.CF_ACCOUNT_ID;
          const CF_API_TOKEN = process.env.CF_API_TOKEN;
          const KV_NAMESPACE_ID = process.env.KV_NAMESPACE_ID;
          const KV_URL = `https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NAMESPACE_ID}/values/chat_state`;
          const HEADERS = { "Authorization": `Bearer ${CF_API_TOKEN}`, "Content-Type": "application/json" };

          async function finalize() {
            try {
              const res = await fetch(KV_URL, { headers: HEADERS });
              let state = res.ok ? await res.json() : {};
              state.status = "exited";
              state.model_info = "Runner disconnected";
              if (!state.last_agent || !state.last_agent.includes("terminated")) {
                state.last_agent = "Session ended.\n\n" + (state.last_agent || "");
              }
              await fetch(KV_URL, { method: 'PUT', headers: HEADERS, body: JSON.stringify(state) });
            } catch (e) {
              console.error("Finalization failed:", e);
            }
          }
          finalize();
          EOF
