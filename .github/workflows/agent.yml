name: OpenClaude Live Chat Agent
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'User Prompt'
        required: true
        type: string
      repo:
        description: 'Target Repo'
        required: true
        type: string
      branch:
        description: 'Target Branch'
        required: false
        default: 'main'
        type: string

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      USER_PROMPT: ${{ github.event.inputs.prompt }}
      TARGET_REPO: ${{ github.event.inputs.repo }}
      TARGET_BRANCH: ${{ github.event.inputs.branch }}
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
      - name: Checkout Target Repo
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          git clone "https://github.com/$TARGET_REPO" target
          cd target
          if ! git checkout "$TARGET_BRANCH" 2>/dev/null; then git checkout -b "$TARGET_BRANCH"; fi

      - name: Setup Node & Install OpenClaude
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install OpenClaude
        run: npm install -g @gitlawb/openclaude

      - name: Run Live Chat Bridge
        working-directory: ./target
        run: |
          node << 'EOF'
          const { execSync } = require('child_process');
          const CF_ACCOUNT_ID = process.env.CF_ACCOUNT_ID;
          const CF_API_TOKEN = process.env.CF_API_TOKEN;
          const KV_NAMESPACE_ID = process.env.KV_NAMESPACE_ID;
          const KV_URL = `https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NAMESPACE_ID}/values/chat_state`;
          const HEADERS = { "Authorization": `Bearer ${CF_API_TOKEN}`, "Content-Type": "application/json" };

          async function getState() {
            const res = await fetch(KV_URL, { headers: HEADERS });
            if (!res.ok) return { msg_id: 0, status: "error" };
            return await res.json();
          }

          async function setState(data) {
            await fetch(KV_URL, { method: 'PUT', headers: HEADERS, body: JSON.stringify(data) });
          }

          async function loop() {
            let lastMsgId = 0;
            // Send the initial prompt that triggered the workflow
            let currentState = await getState();
            lastMsgId = currentState.msg_id;

            while(true) {
              try {
                const state = await getState();
                
                if (state.msg_id > lastMsgId) {
                  lastMsgId = state.msg_id;
                  const userMsg = state.last_user.trim();
                  
                  await setState({ ...state, status: "thinking" });

                  // Handle special commands
                  if (userMsg === '/exit') {
                    await setState({ ...state, status: "exited", last_agent: "Runner terminated by user." });
                    process.exit(0);
                  } 
                  else if (userMsg === '/push') {
                    try {
                      execSync('git add .', { stdio: 'inherit' });
                      execSync('git commit -m "Live chat update"', { stdio: 'inherit' });
                      execSync('git push origin HEAD', { stdio: 'inherit' });
                      await setState({ ...state, status: "waiting", last_agent: "✅ Changes pushed successfully!" });
                    } catch (e) {
                      await setState({ ...state, status: "waiting", last_agent: "❌ Push failed: " + e.message });
                    }
                    continue;
                  }

                  // Run OpenClaude with --continue to maintain chat context
                  // Note: Adjust the provider flags as needed for your setup
                  let agentResponse = "";
                  try {
                    // We use execSync because it's synchronous and easy to capture
                    // The --continue flag tells the CLI to remember the previous turn
                    agentResponse = execSync(
                      `openclaude --provider gemini -p "${userMsg.replace(/"/g, '\\"')}" --continue --dangerously-skip-permissions`,
                      { encoding: 'utf8', timeout: 600000 } // 10 min timeout per prompt
                    );
                  } catch (err) {
                    agentResponse = "Error executing agent: " + err.stdout || err.message;
                  }

                  await setState({ 
                    status: "waiting", 
                    last_user: userMsg, 
                    last_agent: agentResponse || "(No response from agent)",
                    msg_id: lastMsgId 
                  });
                }
              } catch (err) {
                console.error("Bridge error:", err);
              }
              
              // Poll every 3 seconds
              await new Promise(r => setTimeout(r, 3000));
            }
          }

          loop();
          EOF
