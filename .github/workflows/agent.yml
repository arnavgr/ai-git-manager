name: Live Chat Agent (Native Harness)

# FIX: without this, two workflow_dispatch runs could be live at the same
# time, and since there's a single global "chat_state" KV key, both would
# read/write it and garble each other's state. New runs now queue behind an
# in-progress one instead of colliding (see also the dispatcher-side guard
# added in functions/[[path]].js).
concurrency:
  group: live-chat-agent
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'User Prompt'
        required: true
        type: string
      repo:
        description: 'Target Repo'
        required: true
        type: string
      branch:
        description: 'Target Branch'
        required: false
        default: 'main'
        type: string

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: "qwen/qwen3.8-27b"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: "openrouter/free"
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      USER_PROMPT: ${{ github.event.inputs.prompt }}
      TARGET_REPO: ${{ github.event.inputs.repo }}
      TARGET_BRANCH: ${{ github.event.inputs.branch }}
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
      - name: Checkout Manager Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run Tool Engine Tests
        run: node --test tests/tools.test.js

      - name: Clone Target Repo
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          git clone "https://github.com/$TARGET_REPO" target
          cd target
          if ! git checkout "$TARGET_BRANCH" 2>/dev/null; then
            git checkout -b "$TARGET_BRANCH"
          fi

      - name: Run Agent Harness
        env:
          TARGET_DIR: ${{ github.workspace }}/target
        run: node harness/harness.js

      - name: Final KV Status Update
        if: always()
        run: node harness/finalize.js
