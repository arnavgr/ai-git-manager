name: OpenClaude Live Chat Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'User Prompt'
        required: true
        type: string
      repo:
        description: 'Target Repo'
        required: true
        type: string
      branch:
        description: 'Target Branch'
        required: false
        default: 'main'
        type: string

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: "qwen/qwen3.6-27b"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: "openrouter/free"
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      USER_PROMPT: ${{ github.event.inputs.prompt }}
      TARGET_REPO: ${{ github.event.inputs.repo }}
      TARGET_BRANCH: ${{ github.event.inputs.branch }}
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
      - name: Checkout Target Repo
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          git clone "https://github.com/$TARGET_REPO" target
          cd target
          if ! git checkout "$TARGET_BRANCH" 2>/dev/null; then
            git checkout -b "$TARGET_BRANCH"
          fi

      - name: Setup Node & Install OpenClaude
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install OpenClaude
        run: npm install -g @gitlawb/openclaude

      - name: Run Live Chat Bridge
        working-directory: ./target
        run: |
          node << 'EOF'
          const { spawn, spawnSync } = require('child_process');
          const fs = require('fs');
          const path = require('path');

          const CF_ACCOUNT_ID = process.env.CF_ACCOUNT_ID;
          const CF_API_TOKEN = process.env.CF_API_TOKEN;
          const KV_NAMESPACE_ID = process.env.KV_NAMESPACE_ID;
          const KV_URL = `https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NAMESPACE_ID}/values/chat_state`;
          const HEADERS = { 
            "Authorization": `Bearer ${CF_API_TOKEN}`, 
            "Content-Type": "application/json" 
          };

          const MODEL_LABELS = {
            'gemini-3.7': 'Gemini 3.7 Flash',
            'gemini-3.6': 'Gemini 3.6 Flash',
            'gemini-3.5': 'Gemini 3.5 Flash',
            'gemini-3.5-lite': 'Gemini 3.5 Flash-Lite',
            'empero-qwen': 'Empero Qwen 3.8 (27B-FP8)',
            'gemini-3.1-lite': 'Gemini 3.1 Flash-Lite',
            'openrouter': 'OpenRouter Free',
            'groq': 'Groq (Qwen 3.6 27B)'
          };

          // Strict rate-limit/quota indicators only (excluded generic invalid_request_error)
          const RATE_LIMIT_PATTERNS = [
            /error:\s*429/i,
            /rate.?limit/i,
            /quota exceeded/i,
            /resource_exhausted/i,
            /too many requests/i
          ];

          async function getState() {
            try {
              const res = await fetch(KV_URL, { headers: HEADERS });
              if (!res.ok) return null;
              return await res.json();
            } catch (e) {
              return null;
            }
          }

          async function setState(data) {
            try {
              await fetch(KV_URL, { 
                method: 'PUT', 
                headers: HEADERS, 
                body: JSON.stringify(data) 
              });
            } catch (e) {
              console.error("Failed to update KV state:", e);
            }
          }

          function pushChanges() {
            try {
              const status = spawnSync('git', ['status', '--porcelain'], { encoding: 'utf8' });
              if (!status.stdout || !status.stdout.trim()) {
                return { success: true, message: "ℹ️ No code changes detected to push." };
              }

              spawnSync('git', ['add', '.'], { stdio: 'inherit' });

              const commit = spawnSync('git', ['commit', '-m', 'Live chat agent update'], { encoding: 'utf8' });
              if (commit.status !== 0) {
                return { success: false, message: "❌ Commit failed: " + (commit.stderr || commit.stdout || "unknown error").trim() };
              }

              const push = spawnSync('git', ['push', 'origin', 'HEAD'], { encoding: 'utf8' });
              if (push.status !== 0) {
                return { success: false, message: "❌ Push failed: " + (push.stderr || push.stdout || "unknown error").trim() };
              }

              return { success: true, message: "✅ Changes committed and pushed to remote." };
            } catch (e) {
              return { success: false, message: "❌ Push error: " + e.message };
            }
          }

          function runAgentAsync(provider, sessionId, userMsg, effort) {
            return new Promise((resolve) => {
              let env = { ...process.env };
              const args = [];

              const effortLevel = (effort || 'high').toLowerCase();
              env.CLAUDE_CODE_EFFORT = effortLevel;

              // Belt-and-suspenders configuration: populate both CLI flags and environment variables
              if (provider.startsWith('gemini')) {
                args.push('--provider', 'gemini');
                env.CLAUDE_CODE_USE_GEMINI = "1";

                if (provider === 'gemini-3.7') {
                  args.push('--model', 'gemini-3.7-flash');
                  env.GEMINI_MODEL = "gemini-3.7-flash";
                } else if (provider === 'gemini-3.6') {
                  args.push('--model', 'gemini-3.6-flash');
                  env.GEMINI_MODEL = "gemini-3.6-flash";
                } else if (provider === 'gemini-3.5') {
                  args.push('--model', 'gemini-3.5-flash');
                  env.GEMINI_MODEL = "gemini-3.5-flash";
                } else if (provider === 'gemini-3.5-lite') {
                  args.push('--model', 'gemini-3.5-flash-lite');
                  env.GEMINI_MODEL = "gemini-3.5-flash-lite";
                } else if (provider === 'gemini-3.1-lite') {
                  args.push('--model', 'gemini-3.1-flash-lite');
                  env.GEMINI_MODEL = "gemini-3.1-flash-lite";
                }
              } else if (provider === 'empero-qwen') {
                args.push('--provider', 'openai', '--model', 'Qwen/Qwen3.8-27B-FP8');
                env.CLAUDE_CODE_USE_OPENAI = "1";
                env.OPENAI_API_KEY = "free";
                env.OPENAI_BASE_URL = "https://free.empero.org/v1";
                env.OPENAI_MODEL = "Qwen/Qwen3.8-27B-FP8";
              } else if (provider === 'openrouter') {
                args.push('--provider', 'openai', '--model', process.env.OPENROUTER_MODEL);
                env.CLAUDE_CODE_USE_OPENAI = "1";
                env.OPENAI_API_KEY = env.OPENROUTER_API_KEY;
                env.OPENAI_BASE_URL = "https://openrouter.ai/api/v1";
                env.OPENAI_MODEL = env.OPENROUTER_MODEL;
                env.CLAUDE_CODE_MAX_OUTPUT_TOKENS = "4000";
                env.CLAUDE_CODE_OPENAI_MAX_OUTPUT_TOKENS = JSON.stringify({ [process.env.OPENROUTER_MODEL]: 4000 });
              } else if (provider === 'groq') {
                args.push('--provider', 'openai', '--model', process.env.GROQ_MODEL);
                env.CLAUDE_CODE_USE_OPENAI = "1";
                env.OPENAI_API_KEY = env.GROQ_API_KEY;
                env.OPENAI_BASE_URL = "https://api.groq.com/openai/v1";
                env.OPENAI_MODEL = process.env.GROQ_MODEL;
                env.CLAUDE_CODE_MAX_OUTPUT_TOKENS = "16384";
                env.CLAUDE_CODE_OPENAI_MAX_OUTPUT_TOKENS = JSON.stringify({ [process.env.GROQ_MODEL]: 16384 });
              }

              if (sessionId) {
                args.push('--resume', sessionId);
              }

              let finalPrompt = userMsg;
              if (effortLevel !== 'none') {
                finalPrompt = `[Reasoning Effort: ${effortLevel.toUpperCase()}]\n` + finalPrompt;
              }

              args.push('-p', finalPrompt, '--dangerously-skip-permissions');

              const child = spawn('openclaude', args, { env });

              let combinedOutput = "";
              let killedForRateLimit = false;

              const timer = setTimeout(() => {
                child.kill('SIGTERM');
              }, 900000); // 15 min ceiling per attempt

              function onChunk(buf) {
                const chunk = buf.toString();
                combinedOutput += chunk;
                if (!killedForRateLimit && RATE_LIMIT_PATTERNS.some(p => p.test(chunk))) {
                  killedForRateLimit = true;
                  child.kill('SIGTERM');
                }
              }

              child.stdout.on('data', onChunk);
              child.stderr.on('data', onChunk);

              child.on('close', (code) => {
                clearTimeout(timer);
                const match = combinedOutput.match(/--resume\s+([a-zA-Z0-9_-]+)/);
                const newSessionId = match ? match[1] : sessionId;
                const isRateLimit = killedForRateLimit || RATE_LIMIT_PATTERNS.some(p => p.test(combinedOutput));
                const isError = isRateLimit || code !== 0;

                resolve({
                  success: !isError,
                  output: combinedOutput.trim() || "(No output from agent)",
                  sessionId: newSessionId,
                  provider,
                  isRateLimit
                });
              });
            });
          }

          spawnSync('git', ['config', 'user.name', 'OpenClaude Agent'], { stdio: 'inherit' });
          spawnSync('git', ['config', 'user.email', 'agent@arnavgr.com'], { stdio: 'inherit' });

          async function loop() {
            let lastMsgId = 0;
            let lastActivityTime = Date.now();
            const IDLE_TIMEOUT_MS = 30 * 60 * 1000;

            while(true) {
              try {
                const state = await getState();

                if (state && Number(state.msg_id) > lastMsgId) {
                  lastMsgId = Number(state.msg_id);
                  const userMsg = String(state.last_user || "").trim();
                  const effort = String(state.effort || "high");

                  await setState({ ...state, status: "thinking" });

                  if (userMsg === '/exit') {
                    await setState({ 
                      ...state, 
                      status: "exited", 
                      model_info: "Session terminated.",
                      last_agent: "Runner terminated by user.",
                      attachment: null 
                    });
                    process.exit(0);
                  }
                  else if (userMsg === '/push') {
                    const pushResult = pushChanges();
                    await setState({ 
                      ...state, 
                      status: "waiting", 
                      last_agent: pushResult.message,
                      attachment: null 
                    });
                    lastActivityTime = Date.now();
                    continue;
                  }
                  else if (userMsg === '/revert') {
                    const revert = spawnSync('git', ['revert', '--no-edit', 'HEAD'], { encoding: 'utf8' });
                    if (revert.status !== 0) {
                      await setState({ 
                        ...state, 
                        status: "waiting", 
                        last_agent: "❌ Revert failed: " + (revert.stderr || revert.stdout || "unknown error").trim(),
                        attachment: null 
                      });
                    } else {
                      const pushResult = pushChanges();
                      await setState({ 
                        ...state, 
                        status: "waiting", 
                        last_agent: "↩️ Reverted the last commit.\n" + pushResult.message,
                        attachment: null 
                      });
                    }
                    lastActivityTime = Date.now();
                    continue;
                  }

                  // 1. Process File Attachment (Sanitized with path.basename)
                  let instruction = userMsg;
                  if (state.attachment && state.attachment.name && state.attachment.content) {
                    try {
                      const safeFileName = path.basename(state.attachment.name);
                      const targetFilePath = path.join(process.cwd(), safeFileName);
                      fs.writeFileSync(targetFilePath, state.attachment.content, 'utf8');
                      instruction = `[System Notice: The user uploaded file '${safeFileName}', which has been written to the repo root directory.]\n\n` + userMsg;
                    } catch (e) {
                      console.error("Failed to write attachment:", e);
                    }
                  }

                  // 2. Build prioritized fallback list
                  const defaultOrder = [
                    'gemini-3.7', 
                    'gemini-3.6', 
                    'gemini-3.5', 
                    'gemini-3.5-lite', 
                    'empero-qwen', 
                    'gemini-3.1-lite', 
                    'openrouter', 
                    'groq'
                  ];

                  let candidateProviders = [];
                  if (state.provider_choice && state.provider_choice !== 'auto' && defaultOrder.includes(state.provider_choice)) {
                    candidateProviders = [state.provider_choice, ...defaultOrder.filter(p => p !== state.provider_choice)];
                  } else {
                    candidateProviders = defaultOrder;
                  }

                  let activeProvider = state.provider || candidateProviders[0];
                  let failedAttempts = [];
                  let result = await runAgentAsync(activeProvider, state.session_id, instruction, effort);

                  // 3. Fallback Execution Loop
                  if (!result.success) {
                    failedAttempts.push(MODEL_LABELS[activeProvider] || activeProvider);
                    for (const p of candidateProviders) {
                      if (p === activeProvider) continue;

                      await setState({
                        ...state,
                        status: "thinking",
                        model_info: `⚠️ ${MODEL_LABELS[activeProvider]} hit limit. Switching to ${MODEL_LABELS[p]}...`
                      });

                      const continuationMsg = result.isRateLimit
                        ? `You were interrupted by a rate limit/quota error while working on this task: "${userMsg}". Check your previous edits first and continue exactly where you left off — do not redo work you already completed.`
                        : instruction;

                      result = await runAgentAsync(p, result.sessionId || state.session_id, continuationMsg, effort);
                      if (result.success) break;
                      failedAttempts.push(MODEL_LABELS[p] || p);
                    }
                  }

                  let finalOutput = result.output;
                  if (!result.success) {
                    finalOutput = "❌ All configured providers failed or hit quotas.\n\n" + finalOutput;
                  }

                  // 4. Auto-Push Changes
                  const pushResult = pushChanges();
                  finalOutput += "\n\n---\n" + pushResult.message;

                  // 5. Construct Telemetry Status String
                  let telemetryString = `Active: ${MODEL_LABELS[result.provider] || result.provider}`;
                  if (failedAttempts.length > 0) {
                    telemetryString += ` | Failed/Skipped: ${failedAttempts.join(', ')}`;
                  }

                  await setState({ 
                    status: "waiting", 
                    last_user: userMsg, 
                    last_agent: finalOutput,
                    msg_id: lastMsgId,
                    session_id: result.sessionId,
                    provider: result.success ? result.provider : state.provider,
                    provider_choice: state.provider_choice || 'auto',
                    effort: effort,
                    model_info: telemetryString,
                    attachment: null
                  });

                  lastActivityTime = Date.now();
                }

                if (Date.now() - lastActivityTime > IDLE_TIMEOUT_MS) {
                  await setState({ 
                    ...(state || {}), 
                    status: "exited", 
                    model_info: "Session expired (Inactivity)",
                    last_agent: "⏱️ Runner terminated automatically due to 30 minutes of inactivity." 
                  });
                  process.exit(0);
                }

              } catch (err) {
                console.error("Bridge runtime error:", err);
              }

              await new Promise(r => setTimeout(r, 3000));
            }
          }

          loop();
          EOF

      - name: Final KV Status Update
        if: always()
        run: |
          node << 'EOF'
          const CF_ACCOUNT_ID = process.env.CF_ACCOUNT_ID;
          const CF_API_TOKEN = process.env.CF_API_TOKEN;
          const KV_NAMESPACE_ID = process.env.KV_NAMESPACE_ID;
          const KV_URL = `https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NAMESPACE_ID}/values/chat_state`;
          const HEADERS = { "Authorization": `Bearer ${CF_API_TOKEN}`, "Content-Type": "application/json" };

          async function finalize() {
            try {
              const res = await fetch(KV_URL, { headers: HEADERS });
              let state = res.ok ? await res.json() : {};
              state.status = "exited";
              state.model_info = "Runner disconnected";
              if (!state.last_agent || !state.last_agent.includes("terminated")) {
                state.last_agent = "Session ended.\n\n" + (state.last_agent || "");
              }
              await fetch(KV_URL, { method: 'PUT', headers: HEADERS, body: JSON.stringify(state) });
            } catch (e) {
              console.error("Finalization failed:", e);
            }
          }
          finalize();
          EOF
