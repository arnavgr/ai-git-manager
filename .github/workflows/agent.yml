name: OpenClaude Coding Agent
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'User Prompt'
        required: true
        type: string
      repo:
        description: 'Target Repo'
        required: true
        type: string
      branch:
        description: 'Target Branch'
        required: false
        default: 'main'
        type: string

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}

      # --- Primary provider: Gemini (1M context, best for full-repo edits) ---
      CLAUDE_CODE_USE_GEMINI: 1
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash

      # --- Fallback 1: Groq (Blazing fast inference, 8k TPM free tier) ---
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: qwen/qwen3.6-27b

      # --- Fallback 2: OpenRouter (Last resort) ---
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: openrouter/free

      # --- Web search backend for the agent itself (optional but recommended) ---
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      USER_PROMPT: ${{ github.event.inputs.prompt }}
      TARGET_REPO: ${{ github.event.inputs.repo }}
      TARGET_BRANCH: ${{ github.event.inputs.branch }}

    steps:
      - name: Notify KV - Booting Agent
        run: |
          if ! curl -g -s -o /dev/null -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$KV_NAMESPACE_ID/values/agent_status" -H "Authorization: Bearer $CF_API_TOKEN" --data-raw "⏳ 2/4: Initializing OpenClaude agent..."; then
            echo "KV init failed, continuing..."
          fi

      - name: Checkout Target Repo
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
          git clone "https://github.com/$TARGET_REPO" target
          cd target
          
          if [ -z "$TARGET_BRANCH" ]; then
            export TARGET_BRANCH="main"
          fi
          
          if ! git checkout "$TARGET_BRANCH" 2>/dev/null; then
            git checkout -b "$TARGET_BRANCH"
          fi

      - name: Setup Node & Install OpenClaude
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install OpenClaude
        run: |
          npm install -g @gitlawb/openclaude

      - name: Execute Agentic Changes
        run: |
          cd target

          notify() {
            if ! curl -g -s -o /dev/null -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$KV_NAMESPACE_ID/values/agent_status" -H "Authorization: Bearer $CF_API_TOKEN" --data-raw "$1"; then
              echo "KV update failed, continuing..."
            fi
          }

          INSTRUCTION="$USER_PROMPT. After you complete the task, write a concise, professional git commit message summarizing the exact code changes you made. Save this text to a file named 'commit_msg.txt' in the root directory. Do not include markdown formatting in the file."

          run_gemini_3_6_flash() {
            notify "⏳ 3/4: OpenClaude is actively refactoring codebase (Gemini 3.6 Flash)..."
            unset OPENAI_API_KEY OPENAI_BASE_URL OPENAI_MODEL CLAUDE_CODE_USE_OPENAI
            export CLAUDE_CODE_USE_GEMINI=1
            export GEMINI_MODEL="gemini-3.6-flash"
            timeout 8m openclaude --provider gemini -p "$INSTRUCTION" --dangerously-skip-permissions
            return $?
          }

          run_gemini_3_5_flash() {
            notify "⏳ 3/4: 3.6 Flash failed/hit quota — retrying via Gemini 3.5 Flash..."
            unset OPENAI_API_KEY OPENAI_BASE_URL OPENAI_MODEL CLAUDE_CODE_USE_OPENAI
            export CLAUDE_CODE_USE_GEMINI=1
            export GEMINI_MODEL="gemini-3.5-flash"
            timeout 5m openclaude --provider gemini -p "$INSTRUCTION" --dangerously-skip-permissions
            return $?
          }
          
          run_gemini_3_5_flash_lite() {
            notify "⏳ 3/4: 3.5 Flash failed/hit quota — retrying via Gemini 3.5 Flash-Lite..."
            unset OPENAI_API_KEY OPENAI_BASE_URL OPENAI_MODEL CLAUDE_CODE_USE_OPENAI
            export CLAUDE_CODE_USE_GEMINI=1
            export GEMINI_MODEL="gemini-3.5-flash-lite"
            timeout 3m openclaude --provider gemini -p "$INSTRUCTION" --dangerously-skip-permissions
            return $?
          }

          run_gemini_3_1_flash_lite() {
            notify "⏳ 3/4: 3.5 Flash-Lite failed/hit quota — retrying via Gemini 3.1 Flash Lite..."
            unset OPENAI_API_KEY OPENAI_BASE_URL OPENAI_MODEL CLAUDE_CODE_USE_OPENAI
            export CLAUDE_CODE_USE_GEMINI=1
            export GEMINI_MODEL="gemini-3.1-flash-lite"
            timeout 3m openclaude --provider gemini -p "$INSTRUCTION" --dangerously-skip-permissions
            return $?
          }

          run_groq() {
            notify "⏳ 3/4: All Gemini tiers failed — retrying via Groq ($GROQ_MODEL)..."
            unset CLAUDE_CODE_USE_GEMINI
            export CLAUDE_CODE_USE_OPENAI=1
            export OPENAI_API_KEY="$GROQ_API_KEY"
            export OPENAI_BASE_URL="https://api.groq.com/openai/v1"
            export OPENAI_MODEL="$GROQ_MODEL"
            timeout 2m openclaude --provider openai -p "$INSTRUCTION" --dangerously-skip-permissions
            return $?
          }

          run_openrouter() {
            notify "⏳ 3/4: Groq failed/hit quota — retrying via OpenRouter ($OPENROUTER_MODEL)..."
            unset CLAUDE_CODE_USE_GEMINI
            export CLAUDE_CODE_USE_OPENAI=1
            export OPENAI_API_KEY="$OPENROUTER_API_KEY"
            export OPENAI_BASE_URL="https://openrouter.ai/api/v1"
            export OPENAI_MODEL="$OPENROUTER_MODEL"
            timeout 2m openclaude --provider openai -p "$INSTRUCTION" --dangerously-skip-permissions
            return $?
          }

          SUCCESS=0

          if run_gemini_3_6_flash; then
            SUCCESS=1
          elif run_gemini_3_5_flash; then
            SUCCESS=1
          elif run_gemini_3_5_flash_lite; then
            SUCCESS=1
          elif run_gemini_3_1_flash_lite; then
            SUCCESS=1
          fi

          if [ "$SUCCESS" -eq 0 ]; then
            if [ -n "$GROQ_API_KEY" ]; then
              if run_groq; then
                SUCCESS=1
              fi
            fi
          fi

          if [ "$SUCCESS" -eq 0 ]; then
            if [ -n "$OPENROUTER_API_KEY" ]; then
              if run_openrouter; then
                SUCCESS=1
              fi
            fi
          fi

          if [ "$SUCCESS" -ne 1 ]; then
            notify "❌ All configured providers failed or hit quota limits."
            echo "All agent providers failed." >&2
            exit 1
          fi

      - name: Commit and Push
        working-directory: ./target
        run: |
          git config user.name "OpenClaude Agent"
          git config user.email "agent@arnavgr.com"

          if [ -f commit_msg.txt ]; then
            mv commit_msg.txt ../commit_msg.txt
          fi

          git add .

          if git diff-index --quiet HEAD; then
            echo "FINAL_MSG=❌ Finished: OpenClaude made no code changes." >> $GITHUB_ENV
          else
            if [ ! -s ../commit_msg.txt ]; then
              echo "No commit_msg.txt from the agent — generating one from the diff instead."
              DIFF_CONTEXT=$(git diff --cached --stat; echo; git diff --cached | head -c 6000)
              COMMIT_PROMPT="Write a concise, professional git commit message for this diff. Output ONLY the raw commit message text - no markdown, no code fences, no quotes, no commentary.

              $DIFF_CONTEXT"
              
              if [ -n "$CLAUDE_CODE_USE_GEMINI" ]; then
                if ! openclaude --provider gemini -p "$COMMIT_PROMPT" --dangerously-skip-permissions > ../commit_msg_fallback.txt 2>/dev/null; then
                  echo "Fallback gemini commit failed."
                fi
              else
                if ! openclaude --provider openai -p "$COMMIT_PROMPT" --dangerously-skip-permissions > ../commit_msg_fallback.txt 2>/dev/null; then
                  echo "Fallback openai commit failed."
                fi
              fi

              if [ -s ../commit_msg_fallback.txt ]; then
                sed -e '/^```/d' -e "s/^['\"]//" -e "s/['\"]\$//" ../commit_msg_fallback.txt > ../commit_msg.txt
              fi
            fi

            if [ -s ../commit_msg.txt ]; then
              echo "Using AI-generated commit message."
              git commit -F ../commit_msg.txt
            else
              CHANGED=$(git diff --cached --name-only | tr '\n' ' ')
              echo "No AI commit message available — falling back to a file list."
              git commit -m "AI Update: modified ${CHANGED}"
            fi

            git push origin "$TARGET_BRANCH"
            echo "FINAL_MSG=✅ Done: Changes pushed to $TARGET_BRANCH." >> $GITHUB_ENV
          fi
          
      - name: Final KV Status Update
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            STATUS_MSG="${FINAL_MSG:-✅ Done: Job completed successfully.}"
          else
            STATUS_MSG="❌ Failed: OpenClaude crashed. Check GH logs."
          fi

          if ! curl -g -s -o /dev/null -X PUT "[https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$KV_NAMESPACE_ID/values/agent_status](https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$KV_NAMESPACE_ID/values/agent_status)" -H "Authorization: Bearer $CF_API_TOKEN" --data-raw "$STATUS_MSG"; then
            echo "Final KV update failed."
          fi
